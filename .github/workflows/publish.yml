name: Publish CARAT Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the already-public release
        env:
          PUBLIC_SOURCE: https://carat-memory-20261026.tian453485.chatgpt.site/
          # Use the original public entrypoint without hosting-specific injected scripts.
          PUBLIC_INDEX: 
          # Encodes only public filenames and SHA-256 checksums, never executable code.
          PUBLIC_FILE_MANIFEST: 
        run: |
          python3 - <<'PYTHON'
          import os, json, gzip, base64, hashlib, time
          from pathlib import Path, PurePosixPath
          from urllib.request import urlopen, Request
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor
          files=json.loads(gzip.decompress(base64.b64decode(os.environ['PUBLIC_FILE_MANIFEST'])))
          output=Path('public'); output.mkdir()
          def copy_file(item):
              name,expected=item
              path=PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts: raise ValueError('Unsafe path')
              destination=output.joinpath(*path.parts)
              destination.parent.mkdir(parents=True,exist_ok=True)
              request=Request(os.environ['PUBLIC_SOURCE']+quote(name,safe='/')+'?release=20261028-20',headers={'User-Agent':'CARAT-Archive-Public-Backup'})
              for attempt in range(3):
                  try:
                      if name == "index.html": payload=base64.b64decode(os.environ["PUBLIC_INDEX"])
                      else:
                          with urlopen(request,timeout=45) as response: payload=response.read()
                      if hashlib.sha256(payload).hexdigest()!=expected: raise ValueError('Release checksum mismatch: '+name)
                      destination.write_bytes(payload)
                      return
                  except Exception:
                      if attempt==2: raise
                      time.sleep(1+attempt)
          with ThreadPoolExecutor(max_workers=12) as pool: list(pool.map(copy_file,files.items()))
          (output/'.nojekyll').touch()
          assert (output/'index.html').is_file()
          print('Verified public release:',len(files),'files')
          PYTHON
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish public site
        id: deployment
        uses: actions/deploy-pages@v4
